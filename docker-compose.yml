services:
  db:
    image: postgres:15
    container_name: palatavo-db
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: palatavo-backend
    ports:
      - "1337:1337"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_URL: postgresql://strapi:strapi@db:5432/strapi
      DATABASE_SSL: false
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: temp-key-1,temp-key-2,temp-key-3,temp-key-4
      API_TOKEN_SALT: temp-salt
      ADMIN_JWT_SECRET: temp-admin-secret
      JWT_SECRET: temp-secret
      EMAIL_PROVIDER: smtp
      SMTP_HOST: smtp.mail.ru
      SMTP_PORT: 465
      SMTP_USER: opvo_33@mail.ru
      SMTP_PASS: your-password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/scripts:/app/scripts
      - ./backend/public:/app/public
      - ./backend/backups:/app/backups
      - backend_node_modules:/app/node_modules
    command: npm run start

  frontend:
    build: 
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:1337/api
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: palatavo-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:1337/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
    command: npm run dev

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
